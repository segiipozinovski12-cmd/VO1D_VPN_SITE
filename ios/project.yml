name: VO1D_VPN

options:
  bundleIdPrefix: com.vo1d
  deploymentTarget:
    iOS: "17.0"

packages:
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit.git
    revision: 3c5405521ae547de110f6ea65df00b1c05f6a0bc

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  VO1D_VPN:
    type: application
    platform: iOS
    sources:
      - path: VO1DVPN
    info:
      path: VO1DVPN/Resources/Info.plist
      properties:
        CFBundleDisplayName: VO1D_VPN
        CFBundleName: VO1D_VPN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        VO1D_API_BASE_URL: "$(VO1D_API_BASE_URL)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.vo1d.vpn
            CFBundleURLSchemes:
              - vo1dvpn
    entitlements:
      path: VO1DVPN/Resources/VO1D_VPN.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vo1d.vpn
        PRODUCT_NAME: VO1D_VPN
        INFOPLIST_KEY_CFBundleDisplayName: VO1D_VPN
        MARKETING_VERSION: 0.4.1
        CURRENT_PROJECT_VERSION: 5
        VO1D_API_BASE_URL: "https://sincere-commitment-production-8e4e.up.railway.app"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        DEVELOPMENT_TEAM: "$(VO1D_TEAM_ID)"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: VO1D_PacketTunnel

  VO1D_VPN_PREVIEW:
    type: application
    platform: iOS
    sources:
      - path: VO1DVPN
        excludes:
          - Resources/Info.plist
          - Resources/VO1D_VPN.entitlements
    info:
      path: ../ios-preview/PreviewInfo.plist
      properties:
        CFBundleDisplayName: VO1D_VPN
        CFBundleName: VO1D_VPN
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "5"
        CFBundleIconName: AppIcon
        VO1D_API_BASE_URL: "https://REPLACE_ME.invalid"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vo1d.vpn.preview
        PRODUCT_NAME: VO1D_VPN
        INFOPLIST_KEY_CFBundleDisplayName: VO1D_VPN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"

  VO1D_PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: VO1D Tunnel
        CFBundleName: VO1D_PacketTunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    entitlements:
      path: PacketTunnel/VO1D_PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vo1d.vpn.PacketTunnel
        PRODUCT_NAME: VO1D_PacketTunnel
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEVELOPMENT_TEAM: "$(VO1D_TEAM_ID)"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: SwiftyXrayKit
