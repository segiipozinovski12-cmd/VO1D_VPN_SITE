name: VO1D_VPN_PREVIEW

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  VO1D_VPN_PREVIEW:
    type: application
    platform: iOS
    sources:
      - path: ../ios/VO1DVPN
        excludes:
          - Resources/Info.plist
          - Resources/VO1D_VPN.entitlements
    info:
      path: PreviewInfo.plist
      properties:
        CFBundleDisplayName: VO1D_VPN
        CFBundleName: VO1D_VPN
        CFBundleShortVersionString: "0.2.0-preview"
        CFBundleVersion: "1"
        VO1D_API_BASE_URL: "https://REPLACE_ME.invalid"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vo1d.vpn.preview
        PRODUCT_NAME: VO1D_VPN
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
