name: VO1D syntax check
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python
        run: python -m py_compile bot/main.py bot/xray_sync.py
      - name: Check Mini App JavaScript
        run: node --check bot/webapp/app.js
