name: VO1D checks
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Python
        run: python -m py_compile bot/main.py bot/xray_sync.py bot/community_nodes.py bot/test_ru_e2e.py

      - name: Check JavaScript syntax
        run: |
          node --check bot/webapp/app.js
          node --check app.js

      - name: Mini App regression checks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          js = Path("bot/webapp/app.js").read_text()
          html = Path("bot/webapp/index.html").read_text()

          fatal_patterns = [
              r"(?<!\$)\$\('\[data-tab\]'\)\.forEach",
              r"(?<!\$)\$\('\.reveal'\)\.forEach",
          ]
          if any(re.search(p, js) for p in fatal_patterns):
              raise SystemExit("Known fatal selector regression")

          if js.count("async function api(") != 1:
              raise SystemExit("Mini App API helper duplicated or missing")

          expected_money = "function fmtMoney(cents){return '$'+(Number(cents||0)/100).toFixed(2)}"
          if expected_money not in js:
              raise SystemExit("Mini App money formatter corrupted")

          ids = sorted(set(re.findall(r"\$\('#([A-Za-z0-9_-]+)'\)", js)))
          missing = [x for x in ids if not re.search(rf'id=["\']{re.escape(x)}["\']', html)]
          if missing:
              raise SystemExit("JS references missing DOM ids: " + ", ".join(missing))

          print(f"Mini App regression check OK ({len(ids)} selectors)")
          PY


  ru-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download Xray
        run: |
          set -e
          TAG=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray
      - name: RU VPN end-to-end probe
        env:
          XRAY_BIN: /tmp/xray/xray
          RU_E2E_MAX: "24"
          RU_E2E_SOURCE: https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-all.txt
        run: python bot/test_ru_e2e.py
