name: VO1D syntax check
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python
        run: python -m py_compile bot/main.py bot/xray_sync.py
      - name: Check JavaScript syntax
        run: |
          node --check bot/webapp/app.js
          node --check app.js
      - name: Mini App DOM regression checks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          js=Path("bot/webapp/app.js").read_text()
          html=Path("bot/webapp/index.html").read_text()
          banned=[
              "$('[data-tab]').forEach",
              "$('.reveal').forEach",
          ]
          bad=[x for x in banned if x in js]
          if bad:
              raise SystemExit("Known fatal selector regression: "+", ".join(bad))
          ids=sorted(set(re.findall(r"\$\('#([A-Za-z0-9_-]+)'\)",js)))
          missing=[x for x in ids if not re.search(rf'id=[\"\']{re.escape(x)}[\"\']',html)]
          if missing:
              raise SystemExit("JS references missing DOM ids: "+", ".join(missing))
          print(f"Mini App DOM check OK ({len(ids)} selectors)")
          PY
