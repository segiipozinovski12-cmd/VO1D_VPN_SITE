name: iOS Simulator preview

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/VO1DVPN/**"
      - "ios-preview/**"
      - ".github/workflows/ios-preview-simulator.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate preview project
        working-directory: ios-preview
        run: xcodegen generate

      - name: Build VO1D preview for Simulator
        working-directory: ios-preview
        run: |
          set -euo pipefail
          xcodebuild \
            -project VO1D_VPN_PREVIEW.xcodeproj \
            -scheme VO1D_VPN_PREVIEW \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run state and UI tests on iPhone Simulator
        working-directory: ios-preview
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project VO1D_VPN_PREVIEW.xcodeproj \
            -scheme VO1D_VPN_PREVIEW \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/PreviewTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export UI screenshots
        if: always()
        working-directory: ios-preview
        run: |
          mkdir -p build/screenshots
          if [ -d build/PreviewTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/PreviewTests.xcresult --output-path build/screenshots
          fi

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VO1D-preview-validation
          path: |
            ios-preview/build/screenshots
            ios-preview/build/PreviewTests.xcresult
          retention-days: 7
